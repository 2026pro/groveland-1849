ormers`,`River guides`,`Mine-safety specialists`,`Wilderness guides`,`Horse handlers`,`Boat operators`,`Cooks`,`Hospitality staff`,`Costume makers`,`Prop builders`,`Carpenters`,`Maintenance personnel`,`Camera and sound crews`,`Editors`,`Medical personnel`,`Rescue professionals`,`Historians`,`Museum educators`,`Multilingual guest coordinators`,`Drivers`,`Reservation staff`],kd=[`Historical interpretation`,`Performance`,`Guest safety`,`Wilderness first aid`,`Mine and river procedures`,`Hospitality`,`Communication`,`Film production`,`Emergency response`,`Cultural awareness`],Ad=[{title:`Indigenous history before and during the Gold Rush`,body:`The Sierra foothills and the Tuolumne corridor were inhabited long before 1849. The Gold Rush brought displacement, violence and catastrophic population loss to Indigenous peoples of the region. This is not background texture to an adventure story; it is the central historical fact of the period, and it will be presented as such, in consultation with tribal representatives.`},{title:`Environmental effects of mining`,body:`Placer and later hydraulic mining reshaped riverbeds, buried farmland in debris, and introduced mercury into watersheds where it persists today. The expedition depicts historical mining methods while stating plainly what those methods cost the landscape.`},{title:`Immigrant mining communities`,body:`Chinese, Mexican, Chilean, Irish, French, German and African American miners were central to the Gold Rush economy, and were subject to discriminatory taxation, exclusion and violence. Their presence is not a decorative detail in the settlement — it is part of what the settlement is.`},{title:`Women in the mining economy`,body:`Women ran boarding houses, laundries, kitchens, stores and claims, held property, and shaped the commerce of camps that are usually depicted as entirely male. The settlement reflects that economy.`},{title:`Labour and commerce`,body:`Most fortunes in 1849 were made selling to miners rather than mining. Credit, debt, freight, price gouging and company stores are part of the trading mechanics guests actually play.`},{title:`Verified history and fictional storytelling`,body:`The expedition contains invented characters, invented claims and an invented treasure. Guests are told clearly which elements are documented history, which are historically plausible reconstruction, and which are fiction written for the experience. The documentary and all published material will carry the same distinction.`}],jd=`Historical content and site-specific claims will be reviewed by qualified historians, tribal representatives, archaeologists and local authorities before final publication.`,Md=[{area:`Mine`,measures:[`Independent structural engineering assessment before any guest entry`,`Continuous air-quality and ventilation monitoring`,`Helmets, personal lamps and two-way communication for every guest`,`Emergency lighting on independent power`,`Guest tracking and formal headcount protocol`,`Rehearsed evacuation procedures and emergency exits where engineering permits`]},{area:`River and water`,measures:[`Certified river guides and daily flow-based go/no-go standard`,`Concealed modern flotation on every guest`,`Rescue craft, throw bags and downstream safety positions`,`Controlled, shallow, prepared water sections only`,`Cold-water exposure limits and rewarming protocol`]},{area:`Staged action`,measures:[`No live weapons used against participants`,`Choreographed and limited physical contact`,`Stunt coordinator and safety officer present at every staged scene`,`A stated safety word stops any scene immediately`,`Same-evening debrief with the safety team`]},{area:`Medical and remote operations`,measures:[`Licensed medical personnel with the company at all times`,`Pre-expedition medical screening and declared-condition planning`,`Satellite communication independent of mobile coverage`,`Pre-planned evacuation routes and helicopter landing zones`,`Wildfire and flood monitoring with defined cancellation triggers`]},{area:`Guest wellbeing`,measures:[`Withdrawal from any scene at any time, without penalty`,`Dietary, accessibility and religious accommodation planned before arrival`,`No recording in bathrooms, changing, sleeping or medical areas`,`Age, fitness and experience requirements disclosed before booking`,`Independent safety audit before commercial operation begins`]}],Nd=`Every activity described on this website is subject to engineering assessment, permits, environmental review, insurance availability, professional supervision and safety approval. Some elements described here may be modified or removed entirely if they cannot be delivered safely and lawfully. No safety programme eliminates risk; wilderness, water and underground activities carry inherent risks that cannot be designed away.`,Pd=[{title:`Authentic Gold Rush ground`,body:`Groveland and the Tuolumne River corridor sit inside the historical Southern Mines district. The Gold Rush happened here — the story does not have to be transplanted onto a landscape that never lived it.`},{title:`Terrain that supplies the whole journey`,body:`River corridor, foothill wilderness, historic mining ground and a walkable settlement footprint exist within a workable operating radius, which is what makes a seven-day continuous narrative physically possible.`},{title:`A recognised gateway location`,body:`The area is an established route toward Yosemite, with existing visitor traffic, lodging and services — relevant to staffing, logistics and to the museum and educational programmes.`},{title:`Existing historical fabric`,body:`Surviving Gold Rush–era buildings, records and local historical knowledge give the reconstruction something to be accurate to, and give local historians and educators a real role in the project.`},{title:`A community that can staff it`,body:`A resident workforce with outdoor, hospitality and guiding skills is the difference between a set and an operating expedition. The Local Talent Academy is designed around that.`},{title:`Honest constraint`,body:`The same features that make the location right — river, wilderness, historic workings, fire season — are also the source of the project’s largest permitting, environmental and safety obligations. No site has been secured, and site verification is the first major work stream.`}],Fd=[{id:`day-0`,number:`Day 0`,title:`The Threshold`,headline:`The modern world is set down at the door.`,body:`Guests arrive at the staging house and complete safety briefings and medical screening before anything else begins. Phones, watches and modern possessions are inventoried and stored in a secured facility. In their place each guest receives an 1849 identity: a name, a trade, a history, a set of debts and loyalties, historically inspired clothing, mining tools, rations, trade goods, period-style gold tokens — and a sealed personal objective containing a single secret clue.`,beats:[`Safety, medical and consent procedures completed and recorded`,`Secure storage of modern devices and valuables`,`1849 identity, wardrobe fitting and tool issue`,`Rations, trade goods and period-style gold tokens distributed`,`Sealed private objective and first clue issued to each of the ten guests`],safety:`Medical screening, dietary and accessibility needs, emergency contacts and written filming consent are all completed before departure.`},{id:`day-1`,number:`Day 1`,title:`Into the Sierra`,headline:`Ten strangers become one company on the trail.`,body:`The expedition departs using historically inspired transportation — wagon, horse and foot — climbing into the Sierra foothills. The company establishes its first camp, learns to build and manage a fire, prepares a period meal from rations, reads a hand-drawn survey map, and takes its first lesson in working a gold pan. The first trades happen tonight, and the first small deceptions.`,beats:[`Departure by wagon, horseback and foot`,`Camp craft: shelter, fire discipline, water treatment, night watch`,`Period-style cooking from issued rations`,`Navigation by hand-drawn survey map and landmark`,`First instruction in panning and gravel reading`],safety:`Wilderness guides, a licensed medic and satellite communications travel with the company at all times, out of the frame of the documentary cameras.`},{id:`day-2`,number:`Day 2`,title:`The River Road`,headline:`The river gives, and the river takes the careless.`,body:`The company follows the river corridor by boat and trail. Supplies must be rationed deliberately; a wet pack of flour is a real loss to the group. The first professional characters enter the story here — a freighter with a grudge, a claim agent with a ledger, a preacher who knows more than he says — and the participants begin to discover that information can be bought.`,beats:[`River travel by period-styled boats with modern hidden safety systems`,`Portage, line handling and load management`,`Supply attrition and rationing decisions`,`First encounters with professional in-world characters`,`Information becomes a tradeable commodity`],safety:`All water sections are run with certified river guides, concealed modern flotation, throw bags, rescue craft and a river-flow go/no-go standard set each morning.`},{id:`day-3`,number:`Day 3`,title:`The Frontier Settlement`,headline:`A town built entirely of 1849, and entirely of temptation.`,body:`The company reaches a recreated settlement: a saloon, a general store, a blacksmith yard, a trading post, a boarding house and a claims office. Everything has a price in period-style gold tokens or in trade goods. A hot meal, a bed, a mule, a rumour, a map fragment, a night of information from a talkative freighter — all of it can be bought, and every purchase reduces what the company can carry forward.`,beats:[`Saloon, general store, blacksmith yard, boarding house and trading post`,`Period-style gold tokens and trade goods used for meals, supplies and lodging`,`Information purchased from professional characters`,`Equipment upgrades traded against future carrying capacity`,`First real test of whether the ten will pool resources or spend privately`],safety:`Food service, lodging and any alcohol service operate under standard commercial licensing and inspection. Guests may withdraw from any scene at any time.`},{id:`day-4`,number:`Day 4`,title:`The Broken Trail`,headline:`The clues stop agreeing with one another.`,body:`Resources tighten. Two participants discover that their private clues point to different bearings, and a third holds the fragment that reconciles them — but revealing it costs that person their individual advantage. This is the day the experience stops being about gold. Some companies begin trading secrets openly here. Some do not, and pay for it on Day 6.`,beats:[`Deliberate scarcity of food, tools and daylight`,`Apparent contradictions between private clues`,`Negotiation, coalition-building and the first real betrayals`,`A choice between individual advantage and group progress`,`Field producers document the decision without intervening`]},{id:`day-5`,number:`Day 5`,title:`The Outlaws`,headline:`A controlled pursuit, and a run for the boats.`,body:`Professional actors stage an outlaw encounter and a pursuit through the corridor. The company must read its clues under pressure, protect its supplies and reach the boats for a staged escape downriver. It is theatre, rehearsed to the metre and stopped instantly on a safety word — and it is also the moment participants find out who reaches back for the person behind them.`,beats:[`Scripted outlaw encounter performed by professional actors`,`A controlled pursuit along rehearsed ground`,`Supply protection and rapid decision-making under stress`,`A timed escape to the boats and a staged run downriver`,`Debrief with the safety team the same evening`],safety:`No live weapons are used against participants. Physical contact is choreographed and limited. A stunt coordinator, safety officer and medic are present, and any participant or safety professional can stop the scene immediately with a stated safety word.`},{id:`day-6`,number:`Day 6`,title:`The Mine`,headline:`Underground, the arithmetic of trust becomes simple.`,body:`The company enters the engineered mine experience: timbered drifts, lantern-warm lighting, mining carts, quartz seams and the sound of running water behind the rock. Somewhere past the second junction, the passage narrows and the map fragments have to be laid side by side. Each participant decides — with the others watching — whether to reveal the final secret they were given on Day 0.`,beats:[`Guided entry with helmets, lamps and personal communication devices`,`Timbered drifts, mining carts, historic tools and mineral displays`,`Controlled shallow-water passages with prepared footing`,`Continuous air-quality monitoring and guest tracking`,`The moment of disclosure: ten fragments, one route`],safety:`Entry is subject to structural engineering assessment, ventilation and air-quality monitoring, emergency lighting, two-way communication, guest tracking, rehearsed evacuation procedures and emergency exits where engineering permits.`},{id:`day-7`,number:`Day 7`,title:`The Bonanza`,headline:`What the company finds depends on what the company became.`,body:`The final discovery is determined by the decisions the ten made together. The expedition closes with a formal gold accounting, a final feast at the settlement, wet-plate-style 1849 portraits, expedition certificates, and a private screening of the documentary footage — the participants watching themselves choose, from angles they never knew existed. Each guest later receives a professionally edited personal expedition film.`,beats:[`Formal gold accounting against the disclosed rules`,`Final feast at the frontier settlement`,`1849 portrait sitting`,`Expedition certificates and personal reflection`,`Private documentary screening, followed by a professionally edited personal film`]}],Id=[`An 1849 identity`,`Historically inspired clothing`,`Mining tools`,`Food rations`,`Trade goods`,`A personal background story`,`A private objective`,`A secret clue`,`Period-style gold tokens`,`Access to boats, horses, wagons, camps and a frontier settlement`],Ld=[{id:`personal`,name:`Personal Gold`,summary:`Small, controlled quantities of real gold or certified souvenir gold that a participant may discover, keep, redeem or purchase according to rules disclosed in full before booking.`,detail:[`Quantities are fixed, inventoried and audited — not open-ended.`,`Every redemption and purchase rule is published in the booking documentation before a guest pays.`,`Placement, recovery and reconciliation are logged for each expedition.`]},{id:`treasury`,name:`Expedition Treasury`,summary:`Gold or tokens earned by the entire company through cooperation, successful trades and sound decisions. The treasury belongs to the ten, not to any one participant.`,detail:[`Earned collectively; divided by a rule the company agrees on in-world.`,`Directly rewards information sharing over information hoarding.`,`Reconciled publicly during the Day 7 gold accounting.`]},{id:`bonanza`,name:`Grand Bonanza`,summary:`A rare, sponsor-funded or separately financed reward. It is never guaranteed, may not be present on a given expedition, and is not part of what a guest purchases.`,detail:[`Never guaranteed and never advertised as an expected outcome.`,`Funded separately from expedition revenue where it is offered at all.`,`Structured under legal review specifically to avoid any chance-based prize mechanic.`]}],Rd=[`Guests are purchasing an experience, not a guaranteed opportunity to make money.`,`Gold quantities, recovery rules and redemption rules must be disclosed in writing before booking.`,`The entire reward system requires legal review before it is offered to the public.`,`The experience must not operate as an unlicensed lottery, sweepstake or gambling product.`,`Real gold must be inventoried, insured, physically controlled and independently audited.`,`No naturally occurring gold claim will be made about the site without independent verification.`],zd=[`Environmentally concealed cameras built into the historical set`,`Period-disguised cameras inside lanterns, crates, wagons and signage`,`Long-lens landscape and drone-alternative camera positions`,`Guest-worn microphones`,`Professional location sound recording`,`Continuous safety monitoring feeds`,`Field producers travelling with the company`,`A professional post-production and editing team`,`A private final screening on the last night`,`A personally edited expedition film for every guest`],Bd=[`All participants provide explicit written and recorded consent before the expedition begins.`,`“Concealed cameras” means cameras incorporated into the historical environment so that modern equipment never appears in frame. It does not mean recording people secretly or without consent.`,`No recording of any kind takes place in bathrooms, changing areas, medical treatment areas, sleeping quarters designated as private, or any other private space.`,`Participants may request that specific material be excluded, and may withdraw from filming for any portion of the expedition.`,`Commercial use rights, personal-use rights and takedown procedures are set out in the consent documentation, not assumed.`],Vd=[`Timber supports and historically styled drift framing`,`Safe lantern-style lighting on modern circuits`,`Mining carts and rail`,`Historic tools and working demonstrations`,`Quartz and mineral displays`,`Running-water sound design`,`Controlled shallow-water sections with prepared footing`,`Concealed ventilation`,`Continuous air-quality monitoring`,`Emergency lighting on independent power`,`Two-way guide communication`,`Guest tracking and headcount systems`,`Emergency exits where engineering permits`],Hd=[`Gold-toned mineral surfaces`,`Fire-rated metallic scenic finishes`,`Tarnished-gold reflections`,`Warm lantern light`,`Controlled theatrical mist`,`A shallow reflective water surface`,`Historic mining equipment in situ`,`A central discovery display`,`An 1849 portrait platform`],Ud=[{name:`Ultra-high-net-worth experience collectors`,detail:`Travellers who have already bought access to everywhere and are now buying difficulty, meaning and a story only ten people in the world will hold.`},{name:`Private groups and family expeditions`,detail:`A single family, office or friendship group buying out all ten places to be tested together — the strongest early demand signal to validate.`},{name:`Executive and leadership cohorts`,detail:`Boards and founding teams who want a genuine observed test of trust, negotiation and information-sharing rather than a hotel ballroom exercise.`},{name:`International cultural travellers`,detail:`Guests from any country. English fluency is not required: multilingual guides, translated instructions, symbol-based maps, demonstrations and nonverbal systems carry the experience.`},{name:`Documentary and legacy buyers`,detail:`Guests for whom the professionally edited personal film — and the private screening on the final night — is a substantial part of the value.`}],Wd=`Guests may come from anywhere in the world and English fluency is not required. Multilingual guides, translated written instructions, symbol-based maps, physical demonstrations and nonverbal communication systems are designed into the expedition rather than added to it. Accessibility accommodation is part of the required due-diligence programme, and the range of accommodations that can be offered will be determined by the final engineering, terrain and permit conditions.`,Gd=[{title:`Historical storytelling`,body:`The period is treated as research rather than costume. Tools, trades, prices, debts, routes and social frictions of the Southern Mines in 1849 are the working material of the experience — and where an element is invented for the story, guests are told plainly that it is invented.`},{title:`Wilderness adventure`,body:`Seven days of river corridor, foothill trail, camp craft and underground passage, run by qualified guides and medical professionals who stay outside the frame. The difficulty is real enough to matter; the risk management is modern, continuous and unglamorous.`},{title:`Cinematic production`,body:`A documentary crew records the expedition using cameras built into the historical environment, so that no modern equipment appears in shot. Every participant consents in writing beforehand, and each leaves with a professionally edited film of the days they lived.`},{title:`Ultra-premium hospitality`,body:`Behind the hardship sits the service standard of a private expedition: dietary, medical, linguistic and accessibility needs planned before arrival, and a staff-to-guest ratio built for ten people rather than for a crowd.`}];function Kd(){return(0,L.jsxs)(V,{id:`vision`,tone:`dark`,eyebrow:`Pre-development — Tuolumne County, California`,title:`The Groveland 1849 Vision`,lede:(0,L.jsx)(`p`,{children:`Groveland 1849 is a proposal for a seven-day, six-night ultra-premium immersive Gold Rush expedition near Groveland and the Tuolumne River region of California. Ten participants per expedition. No phones, no clocks, no modern clothing, no way out of the story except through it.`}),children:[(0,L.jsx)(`div`,{className:`dust pointer-events-none absolute inset-0 animate-drift`,"aria-hidden":`true`}),(0,L.jsx)(H,{children:(0,L.jsx)(`blockquote`,{className:`relative mx-auto max-w-3xl border-l-2 border-goldt/60 py-2 pl-6`,children:(0,L.jsxs)(`p`,{className:`font-cinzel text-2xl font-bold leading-tight sm:text-3xl lg:text-[2.6rem]`,children:[(0,L.jsx)(`span`,{className:`gold-text`,children:`Gold may be the prize.`}),(0,L.jsx)(`br`,{}),(0,L.jsx)(`span`,{className:`text-parchment`,children:`Character is the discovery.`})]})})}),(0,L.jsx)(_d,{className:`my-10`}),(0,L.jsxs)(`div`,{className:`grid gap-8 lg:grid-cols-[1.15fr,1fr]`,children:[(0,L.jsxs)(H,{className:`space-y-5 font-garamond text-lg leading-relaxed text-parchment/85`,children:[(0,L.jsx)(`p`,{children:`The premise is simple to state and difficult to build. Ten guests are taken out of the present day for a week and placed inside 1849 — into the wagons, the river, the camps, the trading post and the workings of a Gold Rush country that actually happened on this ground. They travel, they trade, they run short of food, they argue about a map, and they are filmed doing it by cameras they cannot see because those cameras are built into the world around them.`}),(0,L.jsx)(`p`,{children:`What the expedition is really testing is not endurance. It is judgement under scarcity. Each participant carries a private objective and a fragment of the route, and every day asks the same quiet question in a different form: what will you give up, and for whom? The answer is what the guest takes home — first as a memory, and then as a film.`}),(0,L.jsx)(`p`,{children:`Guests may come from anywhere in the world, and the experience is designed so that language is never the barrier to entry.`}),(0,L.jsxs)(pd,{children:[(0,L.jsx)(md,{children:`Access and language`}),(0,L.jsx)(`p`,{className:`mt-2 font-baskerville text-[0.86rem] leading-relaxed text-parchment/85`,children:Wd})]})]}),(0,L.jsx)(H,{delay:.08,children:(0,L.jsxs)(pd,{children:[(0,L.jsx)(`p`,{className:`label-sc text-[0.62rem] text-brass/90`,children:`Day 0 — The identity kit`}),(0,L.jsx)(md,{as:`h3`,children:`What every guest is issued before departure`}),(0,L.jsx)(`p`,{className:`mt-3 font-garamond leading-relaxed text-parchment/80`,children:`Modern possessions are inventoried and stored. In their place, each of the ten receives a complete 1849 life:`}),(0,L.jsx)(`div`,{className:`mt-4`,children:(0,L.jsx)(gd,{items:Id,columns:1})}),(0,L.jsx)(`p`,{className:`mt-5 font-fell italic leading-relaxed text-goldt/90`,children:`Ten identities are issued. Ten sealed objectives are issued with them. No two are the same, and no one is told that.`})]})})]}),(0,L hortens the sales cycle and is the cheapest early signal available. Museum, educational and special-event programming is the third: it puts the site to work on days when no expedition is running. If those signals do not appear, the correct response is to change the price, the format or the plan — not to build on the assumption that they will.`})]})}),(0,L.jsx)(H,{children:(0,L.jsx)(`div`,{className:`mx-auto mt-10 max-w-3xl`,children:(0,L.jsx)(U,{variant:`note`,title:`International guests and accessibility`,children:Wd})})}),(0,L.jsx)(`p`,{className:`mx-auto mt-8 max-w-3xl font-baskerville text-[0.76rem] leading-relaxed text-ink/70`,children:`Pre-development concept. The $150,000 figure is a preliminary planning price, not a published rate, and it is subject to change. No expedition has been sold, no place has been reserved, no deposit is accepted and no customer relationship exists. The customer groups described here are hypotheses to be tested, not measured segments.`})]})}function If(){return(0,L.jsxs)(V,{id:`business-model`,tone:`dark`,eyebrow:`Preliminary operating assumptions`,title:`Business Model`,lede:(0,L.jsx)(L.Fragment,{children:`The unit of production is a single expedition: ten guests, seven days, six nights. Every number in the model below is built up from that one unit, which makes the business easy to stress and easy to falsify — and means the assumptions can be argued with directly.`}),children:[(0,L.jsxs)(`div`,{className:`grid gap-4 sm:grid-cols-2 lg:grid-cols-4`,children:[(0,L.jsx)(hd,{label:`Guests per expedition`,value:`10`,sub:`Ten participants, ten secrets`}),(0,L.jsx)(hd,{label:`Duration`,value:`7 days / 6 nights`,sub:`One continuous narrative`}),(0,L.jsx)(hd,{label:`Maximum modelled schedule`,value:`52 / year`,sub:`Stabilized maximum, not year one`}),(0,L.jsx)(hd,{label:`Preliminary ticket price`,value:`$150,000`,sub:`Per guest — a modelling assumption, not a tested price`})]}),(0,L.jsxs)(`div`,{className:`mt-10 grid gap-6 lg:grid-cols-2`,c rchase securities. No securities are currently being offered or sold through this website, and no money is being accepted. Submitting an expression of interest is non-binding, does not create an investment agreement, and does not make the registrant a shareholder.`,`The proposed $1,000 unit, ownership structure, monthly distribution concept, financial projections, project valuation, share count, investor rights, and all other investment terms are preliminary and subject to change. Financial figures are illustrative assumptions, have not been independently audited, and do not guarantee revenue, occupancy, profit, dividends, distributions, share value, project completion, or investment returns.`,`Any future investment opportunity will be made only through official legal documents and a legally authorized process established with qualified securities, tax, accounting, land-use, environmental, and other professional advisers. Prospective investors must conduct independent due diligence and should be able to bear the risk of losing their entire investment.`],zf=`This is a preliminary structural concept only. No securities are currently being offered or sold. The final entity type, share class, ownership percentage, voting rights, valuation, total authorized shares, offering price, investor eligibility, transfer restrictions, and distribution rights will be determined through formal legal, tax, accounting, and securities documentation.`,Bf=`This calculator is an educational illustration based on user-selected assumptions. It does not predict or guarantee actual revenue, profit, dividends, distributions, share value, or investment returns.`,Vf=[`The project has received actual operating revenue.`,`Operating expenses and payroll have been paid.`,`Taxes and legally required payments have been reserved.`,`Debt obligations have been satisfied.`,`Insurance obligations have been satisfied.`,`Maintenance and replacement reserves have been funded.`,`Emergency and working-capital reserves have been funded.`,`The board or authorized manager legally approves the distribution.`,`The distribution is permitted by the final investment documents and applicable law.`],Hf=`Monthly distributions are a proposed payment schedule, not a guaranteed monthly return. Some months may have reduced distributions or no distribution.`,Uf=`Groveland 1849 is currently in the concept, feasibility, site-verification, and pre-development stage. The project has not yet commenced commercial operations. The final property, mine access rights, permits, construction scope, financing structure, operating schedule, and investment terms remain subject to due diligence and formal approval.`,Wf=[`Land ownership or site control`,`Mine ownership or mineral rights`,`Permits and government approvals`,`Investor commitments or subscriptions`,`Partnerships, sponsors or licensees`,`Engaged historians, architects or engineering firms`,`Completed engineering or environmental reports`,`Guest testimonials or media coverage`,`Operating revenue or booked expeditions`],Gf=[{item:`Property ownership and title`,group:`Site and land`},{item:`Mine and mineral rights`,group:`Site and land`},{item:`River-access rights`,group:`Site and land`},{item:`Geotechnical engineering`,group:`Engineering and safety`},{item:`Mine structural assessment`,group:`Engineering and safety`},{item:`Hydrology and flood studies`,group:`Engineering and safety`},{item:`Fire access`,group:`Engineering and safety`},{item:`Emergency evacuation`,group:`Engineering and safety`},{item:`Environmental review`,group:`Environment and heritage`},{item:`Water-quality review`,group:`Environment and heritage`},{item:`Wildlife and bat studies`,group:`Environment and heritage`},{item:`Tribal consultation`,group:`Environment and heritage`},{item:`Archaeological review`,group:`Environment and heritage`},{item:`Building permits`,group:`Permits and licensing`},{item:`Conditional-use permits`,group:`Permits and licensing`},{item:`Boating and commercial river permits`,group:`Permits and licensing`},{item:`Food-service licensing`,group:`Permits and licensing`},{item:`Lodging approval`,group:`Permits and licensing`},{item:`Alcohol licensing`,group:`Permits and licensing`},{item:`Insurance availability`,group:`Legal and compliance`},{item:`Filming and privacy compliance`,group:`Legal and compliance`},{item:`Accessibility`,group:`Legal and compliance`},{item:`Securities-law compliance`,group:`Legal and compliance`}],Kf=[{n:1,text:`Visitor reviews the project.`},{n:2,text:`Visitor explores hypothetical financial scenarios.`},{n:3,text:`Visitor submits a non-binding expression of interest.`},{n:4,text:`No money is accepted.`},{n:5,text:`The project completes feasibility and legal structuring.`},{n:6,text:`Qualified securities counsel selects the appropriate offering pathway.`},{n:7,text:`Required disclosures and official documents are prepared.`},{n:8,text:`Investor eligibility is reviewed.`},{n:9,text:`Registered interested persons are contacted.`},{n:10,text:`A future investment may occur only through the authorized legal process.`}],qf=[`SEC filings`,`State securities compliance`,`An SEC-registered broker-dealer or funding portal`,`Formal subscription documents`,`Investor eligibility verification`,`Financial statements`,`Risk disclosures`,`Escrow`,`Investment limits`,`Transfer restrictions`,`Tax documentation`],Jf=`No securities exemption or offering pathway is selected on this website. That determination will be made by qualified securities counsel as part of formal legal structuring, and it may materially change the terms described here — including who is eligible to invest, how much they may invest, and whether an investment can be transferred or resold.`,Yf=[{risk:`The project may never be completed.`,mitigation:`Staged development with defined go/no-go gates after site verification, permitting and financing. Capital deployment is intended to follow those gates rather than precede them. This reduces the amount at risk at each stage — it does not make completion certain.`},{risk:`Possible loss of all invested capital.`,mitigation:`Any future offering would carry full written risk disclosure and eligibility review. No structure can protect an investor from total loss in a single-asset, pre-revenue development project.`},{risk:`Site-control risk — no property, mine or river access is secured.`,mitigation:`Option and contingent-purchase structures are the intended approach so that land is not bought before diligence clears. If site control cannot be obtained on acceptable terms, the project does not proceed.`},{risk:`Permit risk — conditional-use, building, river, lodging, food and alcohol permits may be refused or heavily conditioned.`,mitigation:`Early pre-application engagement with county and state authorities, and an experience design that can be reduced in scope. Some elements may have to be removed entirely.`},{risk:`Environmental risk — review may restrict or prohibit planned activity.`,mitigation:`Environmental, water-quality, wildlife and bat studies are scheduled before design is finalised, so findings shape the build rather than interrupt it.`},{risk:`Mine safety — underground operation with guests is inherently hazardous.`,mitigation:`Independent structural assessment, ventilation and air monitoring, guest tracking, rehearsed evacuation, and the willingness to abandon the underground component if engineering does not support it.`},{risk:`River safety — moving water is the most common source of serious incident in adventure operations.`,mitigation:`Certified guides, daily flow-based go/no-go standards, concealed flotation, rescue craft and downstream safety positions. Water sections are cancellable without cancelling the expedition.`},{risk:`Wildfire.`,mitigation:`Defined fire-condition cancellation triggers, cleared access and staging, evacuation planning with local fire authorities, and a season calendar built around fire risk. Wildfire can close the operation for extended periods.`},{risk:`Flood and extreme weather.`,mitigation:`Hydrology and flood studies inform siting and camp placement; seasonal scheduling avoids the highest-risk windows. Weather can force cancellation and refund obligations.`},{risk:`Insurance cost and availability.`,mitigation:`Insurance market testing is part of due diligence, before construction commitment. Coverage for guest-occupied underground and whitewater activity may be expensive, restrictive, or unavailable — which alone could prevent the project.`},{risk:`Construction cost overruns.`,mitigation:`A required contingency reserve, staged procurement, and specialist scenic and mine contractors priced before commitment. Overruns remain common in remote, terrain-driven construction.`},{risk:`Demand uncertainty at a $150,000 price point.`,mitigation:`Pre-launch interest registration, private-buyout and corporate channels, and a measured first-season schedule that does not assume 52 expeditions. Demand at this price is unproven.`},{risk:`Pricing uncertainty.`,mitigation:`Price is a modelling assumption, not a tested market clearing price. Sensitivity to price and to mix is modelled in the occupancy scenarios.`},{risk:`Failure to reach break-even occupancy of approximately 72–75%.`,mitigation:`Cost structure is being designed with as much variable cost as possible, and ancillary and licensing revenue diversify the base. Below break-even occupancy the project records losses and would not distribute.`},{risk:`Seasonal interruptions.`,mitigation:`Off-season museum, educational and corporate programming is part of the revenue design. Seasonality still concentrates revenue in a limited operating window.`},{risk:`Specialized staffing is scarce.`,mitigation:`The Local Talent Academy is intended to build the workforce locally rather than compete for it. Training takes time and may delay the ramp.`},{risk:`Financing risk — the project may not raise the capital it requires.`,mitigation:`A staged capital plan and an early interest registry. There is no committed financing today.`},{risk:`Liquidity risk — there is no market for a future interest.`,mitigation:`Any future offering would disclose this plainly. Investors should assume an interest cannot be sold when they want to sell it.`},{risk:`Transfer restrictions.`,mitigation:`Transfer terms will be set in the final documents and are likely to be restrictive. This is a normal feature of private offerings, and it is a real constraint.`},{risk:`No guaranteed distributions.`,mitigation:`The distribution concept is conditional at every step and requires board or manager approval. Some periods may produce reduced distributions or none at all.`},{risk:`Regulatory risk — securities, land-use, environmental and gaming-adjacent rules may all change or be interpreted adversely.`,mitigation:`Qualified counsel in each discipline, and a reward system designed specifically to avoid chance-based prize mechanics. Regulatory outcomes cannot be controlled.`},{risk:`Privacy risk — the project records participants continuously.`,mitigation:`Written and recorded consent, prohibited-area rules, exclusion requests, and defined data-handling procedures. Recording people at length carries residual risk that consent alone does not remove.`},{risk:`Historical and cultural sensitivity.`,mitigation:`Tribal consultation, historian and archaeologist review before publication, and a refusal to romanticise displacement, violence or environmental destruction. Depicting this period will still be contested by some, reasonably.`}],Xf=`These mitigations describe intended approaches, not completed work, and no mitigation eliminates the underlying risk. Every item above may occur despite the measures described.`,Zf=[{q:`Is the project currently operating?`,a:`No. Groveland 1849 is in the concept, feasibility, site-verification and pre-development stage. It has not commenced commercial operations, has no operating revenue, and has not run an expedition.`},{q:`Is the location secured?`,a:`No. No property, mine access right or river access right has been secured. Site verification is the first major due-diligence work stream. The Groveland and Tuolumne River region is the intended search area, not a purchased site.`},{q:`Can I invest today?`,a:`No. No securities are being offered or sold through this website, and no money is accepted. You can register a non-binding expression of interest so that you may be contacted if a legally compliant offering is formally launched.`},{q:`Does registering make me a shareholder?`,a:`No. Registration creates no ownership, no investment agreement, no subscription and no guaranteed right to participate in any future offering.`},{q:`Will the website accept my money?`,a:`No. There is no payment processing, no checkout, no wallet connection and no bank or card collection anywhere on this website. If any website ever asks you to send money to Groveland 1849 outside a formal, documented legal process, treat it as fraudulent.`},{q:`What does one proposed $1,000 unit represent?`,a:`Under the preliminary concept, one proposed unit corresponds to a $1,000 participation in a future investor class. What that unit would actually confer — ownership percentage, voting rights, distribution rights, class seniority — is not yet determined. To be determined through due diligence and official legal documentation.`},{q:`Are monthly distributions guaranteed?`,a:`No. Monthly distribution is a proposed payment schedule, not a guaranteed return. A distribution could only occur after revenue is received, expenses and payroll are paid, taxes and legally required payments are reserved, debt and insurance obligations are satisfied, maintenance and emergency reserves are funded, and the board or authorised manager approves it under the final documents. Some months may have reduced distributions or none.`},{q:`How does the return calculator work?`,a:`It applies your own assumptions to a simple waterfall: revenue less operating expenses, taxes, debt service, insurance and reserves gives distributable cash; a share of that is allocated to a hypothetical investor class and divided by the total eligible units to give an amount per unit. It is an educational illustration of arithmetic, not a forecast, and it cannot predict actual results.`},{q:`When will registered investors be contacted?`,a:`Only if and when feasibility and legal structuring are complete and a legally compliant offering is formally launched. There is no committed timetable. Registration does not guarantee that you will be contacted or that you would be eligible.`},{q:`What legal structure will be used?`,a:`To be determined through due diligence and official legal documentation. The entity type, share or membership class structure, and the securities pathway will be selected with qualified counsel, not chosen on this website.`},{q:`Can international investors participate?`,a:`Unknown at this stage. International participation depends on the offering pathway selected, on United States securities law, and on the securities law of the investor’s own country. Some pathways materially restrict or exclude non-US investors. To be determined through due diligence and official legal documentation.`},{q:`What happens if occupancy is below projections?`,a:`The preliminary model suggests accounting break-even may require roughly 72–75% occupancy. Below that level the project would record losses, would be unlikely to distribute anything, and could require additional capital — which could dilute or extinguish earlier investors.`},{q:`Can an investor lose the entire investment?`,a:`Yes. A single-asset, pre-revenue development project of this type can fail entirely, and an investor should be able to bear the loss of the whole amount invested.`},{q:`Can shares be resold?`,a:`Assume not, at least not freely. Private offerings normally carry transfer restrictions and no secondary market. Final transfer terms are to be determined through due diligence and official legal documentation.`},{q:`Who will own the property?`,a:`To be determined through due diligence and official legal documentation. The intended approach is that a project entity holds or controls the site, but no property is owned or optioned today.`},{q:`Who will own the intellectual property?`,a:`To be determined through due diligence and official legal documentation. Ownership and licensing of the format, the documentary footage and the guest films, and the rights granted by participant consent, will be set out in formal documentation.`},{q:`Is the guest’s gold real?`,a:`The concept includes small controlled quantities of real gold or certified souvenir gold, alongside period-style tokens used for in-world trading. Exact quantities, recovery rules and redemption rules must be disclosed before booking, must be inventoried, insured and audited, and are subject to legal review to ensure the experience is not operated as an unlicensed lottery or gambling product. Guests purchase an experience, not a guaranteed opportunity to make money.`},{q:`How is guest safety managed?`,a:`Through independent engineering assessment, certified guides, continuous air-quality monitoring underground, concealed flotation and rescue capability on the water, choreographed staged action with an immediate stop word, licensed medical personnel with the company, satellite communications and pre-planned evacuation. Every element remains subject to permits, insurance and professional approval, and inherent risk cannot be eliminated.`},{q:`How is personal information protected?`,a:`The registry collects only contact and interest information — never government identifiers, bank, card or brokerage details. Information is stored on a configured backend with access limited to authorised project personnel, is never sold, and can be updated or deleted on request. Registering creates no financial relationship of any kind.`}],Qf=[{title:`What information is collected`,body:`Your full legal name, email address, telephone number, country, state or region, organization (if you provide one), preferred language, indicative investment amount, investor type, accreditation response, strategic-partnership interest, preferred contact method, any message you write, and the timestamps of your consent and submission.`},{title:`What is never collected`,body:`Groveland 1849 does not collect Social Security or other government identification numbers, passport information, bank details, credit- or debit-card details, tax identification numbers, brokerage information, money, or investment signatures through this website. There is no payment processing and no wallet connection anywhere on this site.`},{title:`Why it is collected`,body:`Solely to measure pre-launch interest in the project and, if a legally compliant investment opportunity is formally launched in the future, to contact registered persons with official documentation and eligibility requirements.`},{title:`How it is stored`,body:`In a access-controlled database operated for the project, transmitted over encrypted connections. Where this deployment has no backend configured, nothing is transmitted or stored at all and the interface says so explicitly rather than implying a submission was saved.`},{title:`Who may access it`,body:`Authorised project personnel, and professional advisers bound by confidentiality where their work requires it. Your information is not sold, rented or traded, and is not shared with advertisers.`},{title:`How to update or delete your information`,body:`Send a deletion or correction request from the email address you registered, using the contact address published with the registry. Your record will be removed from the active registry, and confirmation will be sent. Some information may be retained only where a law requires it.`},{title:`How to withdraw consent`,body:`You may withdraw communication consent at any time by replying to any message from the project or by written request. Withdrawing consent stops future project communication and does not affect anything else, because registration creates no obligation on either side.`},{title:`No financial relationship`,body:`Registering creates no financial relationship, no investment commitment, no shareholding and no entitlement. No marketing communication is sent unless you have given communication consent.`}];function $f(){return(0,L.jsx)(V,{id:`disclaimer`,tone:`paper`,eyebrow:`Responsibility`,title:`Legal Disclaimer`,lede:(0,L.jsx)(`p`,{className:`font-garamond text-ink/85`,children:`This notice governs everything else presented on this website. Where any other page appears to conflict with it, this notice controls.`}),children:(0,L.jsx)(H,{children:(0,L.jsxs)(`article`,{className:`rounded-sm border border-ink/30 bg-parchment/60 p-6 sm:p-8`,children:[(0,L.jsx)(`div`,{className:`space-y-6`,children:Rf.map((e,t)=>(0,L.jsxs)(`p`,{className:`max-w-3xl font-baskerville text-[1rem] leading-[1.85] text-ink`,children:[(0,L.jsxs)(`span`,{"aria-hidden":`true`,className:`mr-2 font-fellsc text-ink/50`,children:[t+1,`.`]}),e]},e.slice(0,48)))}),(0,L.jsx)(_d,{className:`mt-8`})]})})})}function ep({className:e=``}){return(0,L.jsxs)(`aside`,{"aria-label":`Important notice`,className:`rounded-sm border border-goldt/50 bg-black/15 px-4 py-3 ${e}`,children:[(0,L.jsx)(`p`,{className:`label-sc mb-1 text-[0.6rem] opacity-70`,children:`Important notice`}),(0,L.jsx)(`p`,{className:`font-baskerville text-[0.78rem] leading-relaxed opacity-90`,children:Lf})]})}var tp=`modulepreload`,np=function(e,t){return new URL(e,t).href},rp={},ip=function(e,t,n){let r=Promise.resolve();if(t&&t.length>0){let e=document.getElementsByTagName(`link`),i=document.querySelector(`meta[property=csp-nonce]`),a=i?.nonce||i?.getAttribute(`nonce`);function o(e){return Promise.all(e.map(e=>Promise.resolve(e).then(e=>({status:`fulfilled`,value:e}),e=>({status:`rejected`,reason:e}))))}function s(e){return import.meta.resolve?imp
